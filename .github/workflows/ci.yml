name: CI

on:
  pull_request:
  push:
    branches:
      - master
  workflow_dispatch:

jobs:
  test:
    name: 单元测试 (py${{ matrix.python-version }} / ${{ matrix.websockets }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          # 生产解释器必须是矩阵里的一维：3.11 上 asyncio.wait_for 会吞取消（issue #67），
          # 只在 3.12 跑等于拿重写过的实现假绿。
          # 3.11 维用 glob 覆盖全部 tests/test_sdk_*.py（client、deadline_stage、
          # no_wait_for、samples_total、transcode_track），新增 SDK 测试文件自动入网，
          # 不会再因为忘了往列表里补名字而静默漏测。
          # 仍然排除 HTTP 继承红：全量 tests/ 在 3.11 上
          # tests/test_http_file_tasks.py 的两个并发准入用例确定性失败
          # （基线 b0818dc 复现 3/3，与 SDK 改动无关，HTTP 里程碑不在本卡边界）。
          - python-version: "3.11"
            websockets: "websockets==15.0.1"
            pytest-targets: "tests/test_sdk_*.py"
          - python-version: "3.11"
            websockets: "websockets"
            pytest-targets: "tests/test_sdk_*.py"
          - python-version: "3.12"
            websockets: "websockets"
            pytest-targets: "tests/"
    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 设置 Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: "${{ matrix.python-version }}"

      - name: 安装依赖
        run: |
          sudo apt-get update && sudo apt-get install -y ffmpeg
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt "${{ matrix.websockets }}"

      - name: 打印 websockets 版本
        run: python -c "import websockets; print(websockets.__version__)"

      - name: 运行 pytest
        env:
          M6_REPEAT_MATRIX_ARTIFACT_DIR: ${{ runner.temp }}/m6-repeat-matrix
        run: |
          mkdir -p "$M6_REPEAT_MATRIX_ARTIFACT_DIR"
          python -m pytest ${{ matrix.pytest-targets }} -q

      - name: 校验五轮矩阵工件结构
        if: always() && matrix.python-version == '3.12'
        env:
          M6_REPEAT_MATRIX_ARTIFACT_DIR: ${{ runner.temp }}/m6-repeat-matrix
        run: |
          python - <<'PY'
          import importlib.util
          import os
          from pathlib import Path

          spec = importlib.util.spec_from_file_location(
              "m6_repeat_matrix", Path("tests/test_http_qa_repeat_matrix.py"),
          )
          module = importlib.util.module_from_spec(spec)
          spec.loader.exec_module(module)
          module.consume_repeat_matrix_trace(
              Path(os.environ["M6_REPEAT_MATRIX_ARTIFACT_DIR"]) / "trace.json",
          )
          PY

      - name: 保存五轮矩阵工件
        if: always() && matrix.python-version == '3.12'
        uses: actions/upload-artifact@v4
        with:
          name: m6-repeat-matrix-py312
          path: ${{ runner.temp }}/m6-repeat-matrix/
          if-no-files-found: error
