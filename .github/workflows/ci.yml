name: CI

on:
  pull_request:
  push:
    branches:
      - master
  workflow_dispatch:

jobs:
  test:
    name: 单元测试 (py${{ matrix.python-version }} / ${{ matrix.websockets }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          # 生产解释器必须是矩阵里的一维：3.11 上 asyncio.wait_for 会吞取消（issue #67），
          # 只在 3.12 跑等于拿重写过的实现假绿。
          # 3.11 只跑 SDK 测试：服务端面向 3.12（AGENTS.md），且仓库全量套件里
          # tests/test_http_file_tasks.py 的两个并发准入用例在 3.11 上确定性失败
          # （基线 b0818dc 复现 3/3，与本 SDK 改动无关，HTTP 里程碑不在本卡边界）。
          - python-version: "3.11"
            websockets: "websockets==15.0.1"
            pytest-targets: "tests/test_sdk_client.py tests/test_sdk_deadline_stage.py tests/test_sdk_no_wait_for.py"
          - python-version: "3.11"
            websockets: "websockets"
            pytest-targets: "tests/test_sdk_client.py tests/test_sdk_deadline_stage.py tests/test_sdk_no_wait_for.py"
          - python-version: "3.12"
            websockets: "websockets"
            pytest-targets: "tests/"
    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 设置 Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: "${{ matrix.python-version }}"

      - name: 安装依赖
        run: |
          sudo apt-get update && sudo apt-get install -y ffmpeg
          python -m pip install --upgrade pip
          pip install numpy rich "${{ matrix.websockets }}" colorama "pytest>=9.1.1" soundfile "pytest-asyncio>=1.4.0" "httpx==0.28.1" "aiohttp==3.14.3"

      - name: 打印 websockets 版本
        run: python -c "import websockets; print(websockets.__version__)"

      - name: 运行 pytest
        run: python -m pytest ${{ matrix.pytest-targets }} -q
